# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy for sebyx07/cybercore-charts
#
# AI-MANAGED, COMMUNITY-FRIENDLY. A public chart library on npm. The agent handles issues, pull
# requests and updates end to end, for everyone: outside contributors, collaborators, the owner
# and the dependency bots. It triages, answers, reviews, declines with a reason, merges, and
# closes what has stalled on its reporter or author. A pull request merges once its author says
# it is ready (out of draft / marked ready for review), it has been reviewed and "CI OK" is
# green. A draft or a "WIP" / "DO NOT MERGE" title is never merged.
#
# Outside contributors' library, demo and docs pull requests are welcome and merge on green like
# anyone's. A human is asked only for what `escalate` names, the platform's hardcoded categories
# (security, license, CLA), and two holds on outside contributions: GitHub asks a maintainer to
# approve a first-time contributor's CI run (a repository Actions setting), and changes to CI,
# release or publish automation stay with the owner (the last `triage.non_goals` line).
#
# Each week the `release-due` checkup judges whether a release is needed and opens a release PR
# when so, and merging it IS the release (.github/workflows/release.yml publishes to npm when the
# version in package.json changes on main, then tags). Dependency-bot PRs merge through this
# agent only: there is no second merger (no GitHub auto-merge workflow) that would skip review.
#
# The gate is the repository, not this file: CI's aggregate "CI OK" check. Verify the ruleset with
# `gh api repos/sebyx07/cybercore-charts/rulesets` before trusting any sentence here about it.
version: 1

tone:
  voice: friendly
  language: en

triage:
  skip_project_members: false
  ask_for_repro: true
  # A chart bug is unreproducible without the options and data, the version and where it runs.
  required_fields: [steps, expected, actual, version, environment]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  # Proposals this project will not take (from CLAUDE.md "Invariants" and "Never").
  non_goals:
    - "A runtime dependency (d3, a tweening or colour library, a DOM helper): the package installs nothing, and the scale, path and colour math lives in src/utils/"
    - "Canvas or WebGL rendering: the output is SVG, which styles with CSS, prints, scales and is readable by assistive technology"
    - "Removing or renaming an export, an option, an event, a `cyber-chart*` class or a custom property outside a major release: all are public API"
    - "Making React, Ember or any framework a requirement of the core: adapters are optional peer dependencies behind their own entry point"
    - "Code that touches window, document or ResizeObserver at import time: importing the package must work in Node (SSR, tests)"
    - "Charts with no text alternative, colour as the only carrier of meaning, or motion that ignores prefers-reduced-motion"
    - "Hardcoded colours or fonts where a cybercore-css token (with its fallback) exists, or a look that only works when cybercore-css is loaded"
    - "A restyle away from the cyberpunk look (dark, neon, angular) as the default: theming is done through tokens and the theme option"
    - "Backwards-compatibility shims, deprecated aliases kept forever, commented-out code or speculative abstractions"
    - "Outside changes to CI, release or publish automation (.github/, bin/, .dz/, .claude/, package.json version, scripts, files or exports): owner only. Dependency-bot bumps are exempt: merge on green"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [copilot]
  auto_merge: true
  # Every author: the bot's own PRs, the dependency bots', outside contributors' and members'.
  # "Ready" is the author's call: a PR merges only once it is out of draft, reviewed and green.
  auto_merge_scope: any
  require_review: true
  # The one required check: ci.yml's aggregate job. Every CI job must pass.
  required_checks:
    - "CI OK"
  close_awaiting_author_after_days: 21

review:
  enabled: true
  force: true
  depth: inline
  profile: chill
  request_changes: true
  approval: false
  high_level_summary: true
  learnings: false
  chat_auto_reply: true
  auto_review:
    enabled: true
    incremental: true
    drafts: false
    base_branches: [main]
    ignore_title_keywords: [WIP, "DO NOT MERGE"]
  anti_noise:
    severity_floor: minor
    max_comments: 10
    dedupe: true
  path_filters: []
  path_instructions:
    - path: "src/types.ts"
      instructions: >-
        Every exported type is public API. A removed or renamed option, a narrowed option type,
        a new required option, or a removed member of a union that callers pass (ChartTheme, an
        event name) is breaking and needs the owner: bin/api-diff lists them. A new option is
        optional, has a TSDoc line stating its default, is read by the chart with that default,
        has a test, and appears in llms.txt and the demo. bin/docs-check fails when README or
        llms.txt name an option this file lacks.
    - path: "src/charts/**"
      instructions: >-
        Charts draw SVG with the helpers in src/utils/svg.ts and extend BaseChart. Check: no
        window, document, ResizeObserver or matchMedia access at import time (module scope or
        static initialisers), and every such access at run time is guarded so toSVG() and server
        rendering work; every id written into the SVG (gradients, filters, clip paths, masks,
        aria-labelledby targets) is unique per chart instance, so two charts on a page never
        share one; the root svg has role="img" and an accessible name; text from data and
        options is set as text or escaped, never concatenated into markup; animation is skipped
        under prefers-reduced-motion and with animate false; destroy() removes every listener,
        observer, timer, animation frame and tooltip element the chart created. Colours come
        from the theme helpers and custom properties with fallbacks, not literals. A new option
        needs a test of its behaviour, not only of its presence.
    - path: "src/utils/**"
      instructions: >-
        Everything exported from src/index.ts is public API, the helpers included: a changed
        signature or return shape is breaking. Math helpers are pure and handle empty arrays,
        a single point, equal min and max, NaN and negative values without dividing by zero or
        emitting NaN into a path. Managers (tooltip, responsive, events) release everything in
        their destroy. escapeHtml and friends are security boundaries: tooltip and label
        content built from data must pass through them.
    - path: "src/react/**"
      instructions: >-
        Thin wrappers over the core classes: no chart logic here. The chart is created in an
        effect and destroyed in its cleanup (Strict Mode mounts twice: no leaked chart, listener
        or observer); prop changes update the existing chart instead of rebuilding where the
        core supports it; nothing touches the DOM during render, so server rendering emits a
        container without throwing. Every option of the core type is reachable as a prop. React
        stays an optional peer dependency and is never imported by the core entry.
    - path: "src/ember/**"
      instructions: >-
        Glimmer components and a modifier over the core classes, shipped behind the ember entry
        point. Same rules as the React adapter: create on insert, destroy on teardown, update on
        argument change, no chart logic. Ember packages stay optional peer dependencies and are
        never imported by the core entry.
    - path: "src/styles/**"
      instructions: >-
        The stylesheet is optional: a chart must be readable without it. Class names
        (cyber-chart and its elements and modifiers) and custom properties are public API:
        renamed or removed is breaking. Values read cybercore-css tokens with a literal fallback,
        var(--token, fallback), so the charts follow a cybercore-css theme and still render
        without it. Every animation stops under prefers-reduced-motion: reduce. Text and focus
        indicators keep WCAG AA contrast on the dark surface.
    - path: "demo/**"
      instructions: >-
        The demo is the documentation site, deployed to GitHub Pages under /cybercore-charts/.
        It uses the library as a user would, through its public entry points: flag a demo-only
        patch that hides a library bug. Every code sample must run as shown against the current
        API. Check keyboard access, contrast and that charts have accessible names.
    - path: "package.json"
      instructions: >-
        dependencies stays empty (zero runtime dependencies is the product's first promise);
        every peerDependency is optional. exports, main, module, types, unpkg and jsdelivr are
        what bundlers and CDNs resolve: a removed or renamed entry is breaking. sideEffects stays
        declared. A version change is a release: it belongs in a release PR that also moves
        CHANGELOG's Unreleased section, and in nothing else.
    - path: ".github/workflows/**"
      instructions: >-
        release.yml must publish only when package.json's version changed on main, only after
        the gate passed, through npm trusted publishing (id-token: write, no NPM_TOKEN). Actions
        stay pinned to a commit SHA, permissions stay minimal, no pull_request_target, no
        auto-merge workflow. ci.yml must keep running bin/check and keep the aggregate CI OK job.

release:
  # No release manager and no agent-published channels: release.yml owns the whole lane (npm
  # first via trusted publishing, then the tag and the GitHub release from CHANGELOG).
  manager: none
  channels: []

escalate:
  # A breaking change asks the owner first: a major version is a maintainer's decision.
  ask_before_acting: [breaking_change]

# Modes. A `scout` firing (the default) is read-only: it reads the checkout and the platform's
# signals and files asks, and an ask that names CI config or this policy is refused at ingest.
# `mode: devops` runs the brief as one task with a shell and delivers a pull request (it needs
# `handoff.mode: fleet`, set above). The briefs that run commands and open a pull request are
# devops; `health`, `repo-census` and `repo-score` only read and report, so they stay scouts.
schedules:
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/schedules/health.md
  # Weekly and judged, so a merge never cuts a release. One weekday per repo, so the fleet is not
  # hit at once (cybercore-css takes Tuesday, zsv-ruby Wednesday, better_structure_sql Thursday,
  # ruby2html Friday).
  - name: release-due
    days: [mon]
    hours_utc: [3]
    brief_file: .dz/schedules/release-due.md
    mode: devops
  # The one exception, so a confirmed security fix does not wait up to a week for the slot above.
  - name: security-release
    days: [tue, wed, thu, fri, sat, sun]
    hours_utc: [2]
    brief_file: .dz/schedules/security-release.md
    mode: devops
  # Monthly: the second Friday of the month (UTC days 8-14); cybercore-css takes the first.
  - name: improve
    days: [fri]
    weeks_of_month: [2]
    hours_utc: [8]
    brief_file: .dz/schedules/improve.md
    mode: devops
  # The developerz.ai platform's standard checkups. Hours follow the platform's per-repo spread
  # (sha256 of the repo name: hour 13 here), so the fleet is not hit at once.
  # The repository census reports and files nothing: on for every repo.
  - name: repo-census
    days: [mon]
    hours_utc: [13]
    brief_file: .dz/schedules/repo-census.md
  # Ten checks of whether this repo can be worked on unattended (gate, green main, tests in CI,
  # agent file, direction page, nothing secret or built committed, aged work, deploy verdict);
  # one ask per failing check. The platform's slot is Tuesday 07:00, which `health` holds: 08:00.
  - name: repo-score
    days: [tue]
    hours_utc: [8]
    brief_file: .dz/schedules/repo-score.md
  # Offered, off: each makes work, and health + improve already cover most of it. Drop the
  # leading `# ` on each line of an entry to run it; its brief is committed beside the others.
  # - name: hygiene
  #   days: [sun]
  #   hours_utc: [13]
  #   brief_file: .dz/schedules/hygiene.md
  # - name: devops
  #   days: [sat]
  #   hours_utc: [1]
  #   brief_file: .dz/schedules/devops.md
  # - name: fix-sweep
  #   days: [thu]
  #   hours_utc: [19]
  #   brief_file: .dz/schedules/fix-sweep.md
  #   mode: devops
