<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0e14" />

    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" type="image/svg+xml" href="/cybercore-charts/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cybercore Charts: a neon telemetry panel with a line chart, a gauge and a donut chart"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="%FONTS_HREF%" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "Cybercore Charts",
        "description": "A zero-dependency SVG chart library with a neon look: line, bar, donut, gauge and sparkline, with React and Ember adapters.",
        "url": "https://sebyx07.github.io/cybercore-charts/",
        "codeRepository": "https://github.com/sebyx07/cybercore-charts",
        "programmingLanguage": ["TypeScript", "JavaScript"],
        "runtimePlatform": "Browser",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Person", "name": "sebyx07", "url": "https://github.com/sebyx07" },
        "maintainer": {
          "@type": "Organization",
          "name": "developerz.ai",
          "url": "https://developerz.ai"
        }
      }
    </script>

    <script>
      // Apply the saved theme before first paint. The key is shared with the
      // cybercore-css site, which lives on the same origin.
      try {
        var theme = localStorage.getItem('cybercore-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main
        style="
          max-width: 40rem;
          margin: 4rem auto;
          padding: 0 1rem;
          font-family: system-ui, sans-serif;
          color: #f0f1f5;
        "
      >
        <h1>Cybercore Charts</h1>
        <p>
          A zero-dependency SVG chart library with a neon look. The charts and this site need
          JavaScript to draw.
        </p>
        <p>
          <a href="https://github.com/sebyx07/cybercore-charts#readme" style="color: #00f0ff"
            >Read the docs on GitHub</a
          >
          or install with <code>npm install cybercore-charts</code>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
